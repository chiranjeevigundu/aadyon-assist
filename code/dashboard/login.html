<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0f17">
<link rel="apple-touch-icon" href="/static/assets/icon-180.png">
<link rel="icon" href="/static/assets/icon-192.png">
<!-- iOS reads these, not the manifest, when the page is added to the Home Screen. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aadyon">
<title>Login - Aadyon Assist</title>
<link rel="stylesheet" href="/static/assets/base.css">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: var(--bg); }
  .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 32px; width: 100%; max-width: 400px; box-sizing: border-box; }
  .login-card h1 { font-size: 24px; margin: 0 0 8px; font-weight: 600; text-align: center; }
  .login-card .sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .form-group input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 15px; box-sizing: border-box; }
  .form-group input:focus { outline: none; border-color: var(--accent); }
  .btn { width: 100%; padding: 12px; background: var(--accent); color: #06122a; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--red); font-size: 13px; text-align: center; margin-bottom: 16px; display: none; }
  .switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 18px; }
  .switch a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="login-card">
  <h1>Aadyon Assist</h1>
  <div class="sub" id="mode-sub">Log in to your finance tracker</div>

  <div id="error-msg" class="error"></div>

  <form id="login-form">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>

  <form id="signup-form" class="hidden">
    <div class="form-group">
      <label for="signup-name">Name</label>
      <input type="text" id="signup-name" placeholder="Jane Doe">
    </div>
    <div class="form-group">
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" required minlength="8" placeholder="At least 8 characters">
    </div>
    <button type="submit" class="btn">Sign Up</button>
  </form>

  <div class="switch">
    <span id="to-signup">New here? <a>Sign up</a></span>
    <span id="to-login" class="hidden">Already have an account? <a>Log in</a></span>
  </div>
</div>

<script src="/static/assets/base.js"></script>
<script src="/static/assets/login.js"></script>
</body>
</html>
